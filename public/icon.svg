
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0728" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="gGrad" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Graphic: Glowing "G" Symbol & Atom Ring -->
  <g filter="url(#glow)">
    <!-- Atom Orbit 1 -->
    <ellipse cx="256" cy="256" rx="180" ry="65" transform="rotate(-30 256 256)" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="12 8" opacity="0.6" />
    <!-- Atom Orbit 2 -->
    <ellipse cx="256" cy="256" rx="180" ry="65" transform="rotate(45 256 256)" stroke="url(#gGrad)" stroke-width="6" opacity="0.4" />
    
    <!-- Stylized "G" for GyanLab -->
    <path d="M 330 180 C 300 140, 210 140, 170 190 C 130 240, 130 310, 175 355 C 220 400, 310 400, 345 350 C 360 325, 360 295, 360 270 L 256 270" 
          stroke="url(#gGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" />
          
    <!-- Glowing Spark Dot -->
    <circle cx="360" cy="270" r="14" fill="#ffffff" />
    <circle cx="256" cy="140" r="10" fill="#38bdf8" />
  </g>
</svg>
