version: '3.8'

services:
  strapi-db:
    image: postgres:15-alpine
    container_name: strapi-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-strapi_db}
    volumes:
      - strapi-db-data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    restart: unless-stopped

  strapi-backend:
    container_name: strapi-backend
    build:
      context: ./hsc-cms
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: strapi-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-strapi_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password_here}
      APP_KEYS: ${APP_KEYS:-key1,key2,key3,key4}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-secure_token_salt_here}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-secure_admin_jwt_here}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:-secure_transfer_salt_here}
      JWT_SECRET: ${JWT_SECRET:-secure_client_jwt_here}
      PUBLIC_URL: ${PUBLIC_STRAPI_URL:-https://api.yourdomain.com}
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-https://yourdomain.com}
    depends_on:
      - strapi-db
    restart: unless-stopped

  nextjs-frontend:
    container_name: nextjs-frontend
    build:
      context: ./hsc-cms-frondend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${PUBLIC_STRAPI_URL:-https://api.yourdomain.com}
    depends_on:
      - strapi-backend
    restart: unless-stopped

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - strapi-backend
      - nextjs-frontend

volumes:
  strapi-db-data:
